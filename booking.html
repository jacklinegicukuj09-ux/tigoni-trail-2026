<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tigoni Trail 2026 - Booking</title>
    <!-- Stops the favicon 404 error-->
     <link rel="shortcut icon" href="#">
     <!-- Link to CSS-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Main Navigation -->
     <header>
        <nav class="navbar">
            <h1 class="logo">Tigoni Trail 2026</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About & Itinerary</a></li>
                <li><a href="booking.html" class="active">Book Spot</a></li>
                
            </ul>
        </nav>
     </header>

     <!-- Booking Form Section -->
      <div class="booking-container">
        <section class="booking card">
            <h2>Book Your Spot</h2>
            <p>Fill in your your details below</p>

<form id="trailForm" action="#">
    <div class="field-group">
        <label for="FullName">Full Name</label>
        <input type="text" id="fullname" name="fullname" required>
    </div>

    <div class="field-group">
        <label for="userEmail">Email:</label>
        <input type="email" id="userEmail" name="userEmail"required>
    </div>
<div class="field-group">
    <label for="userPhone">Phone Number</label>
    <input type="tel" id="userphone" name="userphone" required>
</div>
<button type="submit" class="submit-btn">Submit Booking</button>
</form>

<!-- Message container updated by Javascript -->
 <p id="confirmationMessage" class="hidden-message"></p>
 </section>
 </div>
  <!-- Closes booking-container -->

      <script src="script.js"></script>
</body>
</html>
